interface:
  display_name: "أنشئ هوية المتجر"
  short_description: "هوية متجر بصور PNG مباشرة وألوان نصية"
  default_prompt: "استخدم $create-store-brand-kit لإنشاء أربعة مخرجات منفصلة لمتجري: لوحة هوية PNG كاملة 1536×1024، ألوان HEX نصية، صورة شعار عربية رائعة PNG شفافة 1024×256 يظهر فيها الاسم حرفيًا، وأيقونة PNG شفافة 32×32 مع تقرير فحص. أنشئ وحرّر Raster مباشرة واحفظ PNG مباشرة. يُمنع SVG وHTML وInkscape وأي وسيط أو أداة متجهية في أي مرحلة، حتى كملف مؤقت أو للتحويل إلى PNG. لا تجمع المخرجات في صورة واحدة."
