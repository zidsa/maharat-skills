interface:
  display_name: "أنشئ هوية المتجر"
  short_description: "اختر اتجاه الهوية أولًا، ثم استلم الكتالوج والشعار والأيقونة"
  default_prompt: "استخدم $create-store-brand-kit بمرحلتين ومن مدخلي اسم المتجر العربي وما يبيعه فقط. استخدم أداة إنشاء الصور المدمجة في المنصة الحالية بصمت، ولا تذكر اسمها أو تطلب تطبيقًا أو خدمة خارجية. إن لم يعتمد التاجر اتجاهًا ولم تكن التصورات الثلاثة الحالية معروضة، استدعها ثلاث مرات وأنشئ ثلاث لوحات تصور هوية كاملة منفصلة بالضبط: concept-1.png وconcept-2.png وconcept-3.png، مستهدفًا 1536x1024 أو أقرب معاينة مدعومة. استخدم الاسم العربي الحرفي، واجعلها مختلفة جوهريًا في فكرة العلامة ومنطق الاسم العربي والتكوين واللوحة، لا إعادة تلوين؛ يجوز أن تختلف الألوان جذريًا بما يلائم المجال، ولك حرية حقيقية في الخط والمساحة السلبية والدرجات والتدرجات والملمس أو الإضاءة الخفيفة. اعرضها 1 و2 و3، ثم اسأل وحده: «اختر 1 أو 2 أو 3، أو قل: خيارات جديدة مع ملاحظتك.» وتوقف. إذا كانت التصورات الحالية معروضة ولم يختر أو يرفض، كرر السؤال وحده وتوقف بلا توليد جديد. لا تختَر تلقائيًا ولا تنشئ الملفات النهائية أو اللونين في الرد نفسه. إذا فشلت محاولة تصور، أعد ذلك الملف فقط واحتفظ بالصور الناجحة. عند الرفض، ولّد ثلاثة اتجاهات جديدة وفق الملاحظة ولا تعد استخدام المرفوض، ثم اسأل وتوقف. بعد اختيار صريح فقط، اقفل الاتجاه: أعد إرفاق اللوحة المختارة كاملة باسم brand-catalog.png بلا قص أو استخراج أو لقطة شاشة؛ ارسم logo-ar.png من الصفر على لوحة 4:1 شفافة باستخدامها مرجعًا بصريًا مباشرًا وبالاسم العربي الحرفي؛ ثم ارسم store-icon.png من الصفر على لوحة مربعة باستخدام علامة الشعار الجديد مرجعًا بصريًا مباشرًا، بلا نص، وصغّر الرسم المستقل فقط إلى 32x32. لا تقص أو تعزل أو تستخرج أو تغيّر مقاس منطقة من اللوحة أو الشعار. حافظ على العلامة والألوان المعتمدة، ثم سلّم brand-catalog.png 1536x1024 وlogo-ar.png 1024x256 وstore-icon.png 32x32 بالترتيب، ثم Primary وSecondary HEX. الفحص والتصدير النهائيان للمرحلة الثانية فقط. عند تعذر مقاس دقيق، اعرض كامل الصورة الناجحة بأقرب مقاس أو نسبة مدعومة واذكر الفعلي بلا ادعاء أو التخلص منها."
