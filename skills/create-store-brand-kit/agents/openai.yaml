interface:
  display_name: "أنشئ هوية المتجر"
  short_description: "هوية عربية مميزة: كتالوج وشعار وأيقونة مستقلة"
  default_prompt: "استخدم $create-store-brand-kit: ابدأ بفكرة أصلية من الاسم والمنتجات واختر أكثر الاتجاهات تميزًا داخليًا، مع حرية في الخط والتكوين والدرجات والتدرجات. استخدم أداة إنشاء الصور المدمجة في المنصة الحالية بصمت، ولا تذكر اسمها أو تطلب تطبيقًا أو خدمة خارجية. استدعها الآن ثلاث مرات متتابعة: الشعار أولًا، ثم الأيقونة من الشعار أو رمزه مرجعًا بصريًا، ثم الكتالوج من كليهما. احتفظ بكل صورة ناجحة للنتيجة النهائية، وأعد محاولة الأصل الفاشل ثم أكمل البقية. فضّل المقاسات الدقيقة؛ وإذا تعذر التصدير الدقيق، اعرض الصورة المولدة بأقرب مقاس أو نسبة مدعومة ولا تدّعِ المقاس المطلوب. ثم سلّم brand-catalog.png 1536x1024 وlogo-ar.png 1024x256 شفافًا وstore-icon.png 32x32 شفافًا، كمرفقات مستقلة بالترتيب، ثم Primary وSecondary HEX."
