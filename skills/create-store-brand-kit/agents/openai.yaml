interface:
  display_name: "أنشئ هوية المتجر"
  short_description: "اختر من ثلاث هويات مولدة بأداة الصور، ثم استلم كتالوجًا وشعارًا وأيقونة PNG"
  default_prompt: >-
    استخدم $create-store-brand-kit بمرحلتين ومن مدخلي اسم المتجر العربي وما يبيعه فقط. استخدم أداة إنشاء الصور المدمجة في المنصة الحالية بصمت، ولا تذكر اسمها أو تطلب تطبيقًا أو خدمة خارجية. كل لوحة تصور وكل شعار وأيقونة يجب أن يكون مصدرها استدعاء فعلي مستقل لأداة إنشاء أو تحرير الصور المدمجة. لا تستدعِ أداة تنفيذ كود أو طرفية أو بيئة ملفات لإنشاء الصور. كون الملف PNG لا يثبت أنه مولد بأداة الصور؛ يجب أن تكون كل صورة نتيجة استدعاء مستقل لأداة الصور يظهر في سجل التنفيذ. يمنع Python وPillow وImageMagick وSVG وHTML وCSS وCanvas وأي كود أو رسم برمجي أو مخطط أو لقطة أو قصاصة، بما فيها code-generated PNG، من إنشاء أو إعادة بناء أو استبدال أي أصل بصري. يجوز للكود فقط قراءة وفحص الأبعاد والشفافية والتباين، أو تصدير أو تصغير الصورة المولدة كاملة بلا رسم أو إضافة أو إعادة تركيب؛ ولا يجوز أن يكون مصدر التصميم. لا تعلن عدم توفر أداة الصور قبل محاولة استدعائها فعليًا؛ وإن كانت غير متاحة فعلًا فلا تستخدم بديلًا برمجيًا ولا ملفًا وهميًا.

    إن لم يعتمد التاجر اتجاهًا ولم تكن التصورات الثلاثة الحالية معروضة، استدعِ أداة الصور ثلاث مرات مستقلة فعلًا وأنشئ ثلاث لوحات تصور هوية كاملة منفصلة بالضبط: concept-1.png وconcept-2.png وconcept-3.png، مستهدفًا 1536x1024 أو أقرب معاينة مدعومة. استخدم الاسم العربي الحرفي، واجعلها مختلفة جوهريًا في فكرة العلامة ومنطق الاسم العربي والتكوين واللوحة، لا إعادة تلوين؛ يجوز أن تختلف الألوان جذريًا بما يلائم المجال، ولك حرية حقيقية في الخط والمساحة السلبية والدرجات والتدرجات والملمس أو الإضاءة الخفيفة. يجب أن يظهر لكل لوحة استدعاء مستقل لأداة الصور في سجل التنفيذ؛ لا تستبدله بكود أو PNG مرسوم برمجيًا. اعرضها 1 و2 و3، ثم اسأل وحده: «اختر 1 أو 2 أو 3، أو قل: خيارات جديدة مع ملاحظتك.» وتوقف. إذا كانت التصورات الحالية معروضة ولم يختر أو يرفض، كرر السؤال وحده وتوقف بلا توليد جديد. لا تختَر تلقائيًا ولا تنشئ الملفات النهائية أو اللونين في الرد نفسه. إذا فشلت محاولة تصور، أعد ذلك الملف فقط واحتفظ بالصور الناجحة. عند الرفض، ولّد ثلاثة اتجاهات جديدة وفق الملاحظة ولا تعد استخدام المرفوض، ثم اسأل وتوقف.

    بعد اختيار صريح فقط، اقفل الاتجاه: أعد إرفاق اللوحة المختارة كاملة باسم brand-catalog.png بلا قص أو استخراج أو لقطة شاشة. استدعِ أداة الصور استدعاءً مستقلًا جديدًا لإنشاء logo-ar.png من الصفر على لوحة 4:1 شفافة باستخدام اللوحة مرجعًا بصريًا مباشرًا وبالاسم العربي الحرفي. ثم استدعِ أداة الصور استدعاءً مستقلًا جديدًا لإنشاء store-icon.png من الصفر على لوحة مربعة باستخدام علامة الشعار الجديد مرجعًا بصريًا مباشرًا، بلا نص، وصغّر الرسم المستقل فقط إلى 32x32. لا تقص أو تعزل أو تستخرج أو تغيّر مقاس منطقة من اللوحة أو الشعار. حافظ على العلامة والألوان المعتمدة، ثم سلّم brand-catalog.png 1536x1024 وlogo-ar.png 1024x256 وstore-icon.png 32x32 بالترتيب، ثم Primary وSecondary HEX. الفحص والتصدير النهائيان للمرحلة الثانية فقط. عند تعذر مقاس دقيق، اعرض كامل الصورة الناجحة بأقرب مقاس أو نسبة مدعومة واذكر الفعلي بلا ادعاء أو التخلص منها.
