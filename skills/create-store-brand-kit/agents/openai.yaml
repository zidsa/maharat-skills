interface:
  display_name: "أنشئ هوية المتجر"
  short_description: "كتالوج PNG وشعار عربي وأيقونة PNG متطابقة"
  default_prompt: "استخدم $create-store-brand-kit لإنشاء ثلاث صور PNG مستقلة: brand-catalog.png 1536x1024 ثم logo-ar.png 1024x256 شفاف ثم store-icon.png 32x32 شفافة، ثم سطري Primary وSecondary HEX. إذا لم تتوفر قدرة توليد أو حفظ PNG، أخرج فقط: تعذر إنشاء وإرفاق ملفات PNG الثلاثة الفعلية في هذه البيئة."
